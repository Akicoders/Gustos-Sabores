services:
  mysql:
    image: mysql:8.4
    container_name: gustos_mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gustos_sabores}
      MYSQL_USER: ${MYSQL_USER:-gustos_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gustos_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: gustos_backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:4321}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gustos_sabores}
      MYSQL_USER: ${MYSQL_USER:-gustos_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gustos_pass}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: gustos_frontend
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "4321:4321"
    depends_on:
      - backend

volumes:
  mysql_data:
